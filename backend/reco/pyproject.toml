# Munch recommendation service — packaging + toolchain configuration.
# Tooling is wired in Phase 0 and stays green thereafter (spec §2).

[project]
name = "munch-reco"
version = "0.1.0"
description = "Munch recommendation service: hard filters, heuristic scorer, learned ranker, and the offline eval harness."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Production backend (D-019, food-5eb2a). Optional so the MUNCH_BACKEND=memory
# $0 demo image skips ~40MB of grpc/google deps; all imports are lazy, and the
# Dockerfile installs .[firestore] for production.
firestore = [
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.5",
    # Apple client-secret JWT (ES256) for TN3194 token revocation (D-013).
    "pyjwt[crypto]>=2.9",
]
# Layer 4 training/serving (D-008). Optional so the $0 memory-mode demo and
# core serving stay LightGBM-free — the learned ranker activates only when a
# model file is present AND this extra is installed; otherwise heuristic.
ml = ["lightgbm>=4.5"]
# Layer 5 LLM reasons (D-004). Optional: with no key, templated fallback.
llm = ["anthropic>=0.40"]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28", # transport for FastAPI's TestClient
    # The optional extras are included so mypy --strict type-checks the
    # adapters/training/LLM code and their tests can run in CI verify.
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.5",
    "pyjwt[crypto]>=2.9",
    "lightgbm>=4.5",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evalharness", "learnedranker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Why these rule sets: E/F are table stakes; I keeps import diffs clean;
# UP enforces modern 3.12 syntax; B catches real bug patterns (mutable
# defaults, useless comparisons); SIM flags needless complexity — which is
# the executable form of the "no AI slop" contract.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
# firebase_admin ships no type stubs; its surface is contained inside
# adapters/firestore.py behind the TokenVerifier port so untyped code never
# leaks past the seam.
[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true

# LightGBM (ml) and anthropic (llm) ship no type stubs; imported lazily behind
# feature flags, never on the $0 demo or core serve path.
[[tool.mypy.overrides]]
module = ["lightgbm.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported from Phase 0 but a fail-under threshold is only added
# in Phase 2 when real ranking logic exists — a threshold over stubs is theater.
addopts = "-q --cov=app --cov=evalharness --cov=learnedranker --cov-report=term-missing"
