# XcodeGen specification — the committed source of truth for the Xcode project.
#
# Why: this repo is authored on Windows, where Xcode cannot run. The
# .xcodeproj is generated in CI (`xcodegen generate`) and git-ignored, so the
# project file can never drift from this spec (docs/DECISIONS.md D-001).
name: Munch

options:
  bundleIdPrefix: com.munch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # FUTURE(Phase 6): DEVELOPMENT_TEAM + manual signing config for archive/TestFlight.

packages:
  MunchKit:
    path: Packages/MunchKit

targets:
  Munch:
    type: application
    platform: iOS
    sources:
      - Munch
    dependencies:
      - package: MunchKit
    info:
      path: Munch/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        # Without these, XcodeGen hardcodes 1.0/1 into the generated plist and
        # the MARKETING_VERSION settings above are silently inert — version
        # bumps would never reach the shipped binary (TestFlight trap).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Bundled OFL display serif (spec §4.4 — a real font, not a system
        # stand-in). XcodeGen copies grouped resources flat into the bundle,
        # so the registered name has no folder prefix.
        UIAppFonts:
          - Fraunces.ttf
        # The $0 demo talks plain-HTTP to a dev server on the host machine.
        # Scoped to local networking only — production traffic is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Honest, user-facing copy — Apple reviewers read this string (spec §8.4).
        NSLocationWhenInUseUsageDescription: >-
          Munch uses your location to find restaurants near you.
    settings:
      base:
        # FUTURE(Phase 6): confirm final bundle id against the App Store Connect record.
        PRODUCT_BUNDLE_IDENTIFIER: com.munch.app
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1

  # The Phase 4 gate runner: onboarding -> deck -> swipes -> match against the
  # live demo backend on the simulator (ios-e2e.yml starts the API first).
  MunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MunchUITests
    dependencies:
      - target: Munch

  # Unit tests for app-target logic stay thin by design: pure logic lives in
  # MunchKit (tested on Linux); views are exercised by MunchUITests.

# Explicit scheme: CI invokes `xcodebuild -scheme Munch`, and relying on
# xcodebuild's scheme autocreation for a freshly generated project is a known
# flaky point — make the scheme deterministic instead.
schemes:
  Munch:
    build:
      targets:
        Munch: all
    # The test action carries the UI-test bundle so `xcodebuild test -scheme
    # Munch -only-testing:MunchUITests` works in the ios-e2e gate lane.
    test:
      targets:
        - MunchUITests
