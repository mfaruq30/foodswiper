# SwiftLint configuration — enforced on Linux CI (pinned 0.63.3 in verify.yml).
#
# Optional local use on Windows requires 0.64+ (experimental) with two caveats:
# no '?[]' glob characters in paths, and linted files must be LF — both already
# guaranteed here by plain dir paths + .gitattributes.
included:
  - Munch
  - Packages/MunchKit/Sources
  - Packages/MunchKit/Tests

excluded:
  - Packages/MunchKit/.build

opt_in_rules:
  - empty_count # `isEmpty` over `count == 0` — intent plus O(1)
  - sorted_imports

line_length:
  warning: 120
  error: 160

# SwiftFormat (the formatter) ADDS trailing commas in multiline collections;
# SwiftLint's default REJECTS them. One convention must win or CI is
# unsatisfiable — we follow the formatter.
trailing_comma:
  mandatory_comma: true

# View-builder helpers legitimately take icon/tint/label/identifier/hint.
function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length: 2 # allow conventional short names like `id`, `dx`
  excluded: [x, y] # idiomatic geometry locals (custom Layout math)
